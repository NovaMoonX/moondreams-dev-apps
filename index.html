<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moondreams Dev Apps</title>

    <!-- Redirect from Firebase hosting to custom domain if not on a preview channel -->
    <script>
      (function () {
        const host = window.location.hostname;
        const isFirebaseHost =
          host.includes('firebaseapp.com') || host.includes('web.app');
        const isPreviewChannel = host.includes('--'); // Preview channels always use 'site--channel-hash' format

        if (isFirebaseHost && !isPreviewChannel) {
          window.location.replace(
            'https://apps.moondreams.dev' +
              window.location.pathname +
              window.location.search +
              window.location.hash,
          );
        }
      })();
    </script>

    <!-- Primary Meta Tags -->
    <meta name="title" content="Moondreams Dev Apps" />
    <meta
      name="description"
      content="A collection of mini-apps designed by Moondreams Dev to fit whatever felt useful, fun, or simply interesting during a particular moment in life. From simple utilities to creative experiments, these apps are a reflection of curiosity and passion for crafting unique digital experiences. Willing to build apps on-request for those who have an idea or concept that they would like to see brought to life."
    />

    <!-- Favicon for Light Mode -->
    <link
      rel="icon"
      href="/logos/logo-light-transparent.svg"
      media="(prefers-color-scheme: light)"
    />

    <!-- Favicon for Dark Mode -->
    <link
      rel="icon"
      href="/logos/logo-dark-transparent.svg"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Light Mode -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />

    <!-- Dark Mode -->
    <meta
      name="theme-color"
      content="#09090b"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://apps.moondreams.dev/" />
    <meta property="og:title" content="Moondreams Dev Apps" />
    <meta
      property="og:description"
      content="A collection of mini-apps built to fit whatever felt useful, fun, or simply interesting during a particular moment in life."
    />
    <meta
      property="og:image"
      content="https://moondreams-dev-apps.web.app/banners/social-banner.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://apps.moondreams.dev/" />
    <meta property="twitter:title" content="Moondreams Dev Apps" />
    <meta
      property="twitter:description"
      content="A collection of mini-apps built to fit whatever felt useful, fun, or simply interesting during a particular moment in life."
    />
    <meta
      property="twitter:image"
      content="https://moondreams-dev-apps.web.app/banners/social-banner.png"
    />

    <!-- Meta Tags Generated with https://metatags.io -->
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
