name: PR sync check
# Marks each open PR that is behind its base or would conflict with it, so a
# person or an agent sees it without asking. Labels only: nothing is merged here.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: pr-sync-check-${{ github.event.pull_request.number || 'all' }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check open PRs against their bases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ONLY_PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create behind-base --color FBCA04 --description "Its base has commits it doesn't have yet" --force >/dev/null
          gh label create merge-conflict --color B60205 --description "Merging its base would conflict" --force >/dev/null
          set_label() { gh api -X POST "repos/$REPO/issues/$1/labels" -f "labels[]=$2" >/dev/null || echo "::warning::Couldn't add $2 to #$1"; }
          drop_label() { gh api -X DELETE "repos/$REPO/issues/$1/labels/$2" >/dev/null 2>&1 || true; }
          filter='.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefName):\(.baseRefName)"'
          if [ -n "$ONLY_PR" ]; then
            prs=$(gh pr view "$ONLY_PR" --json number,headRefName,baseRefName,isCrossRepository --jq "[.] | $filter")
          else
            prs=$(gh pr list --state open --limit 100 --json number,headRefName,baseRefName,isCrossRepository --jq "$filter")
          fi
          [ -z "$prs" ] && exit 0
          while read -r number pair; do
            result=$(bash scripts/prSync.sh --json "$pair" || true)
            state=$(echo "$result" | sed -n 's/.*"state":"\([a-z]*\)".*/\1/p')
            echo "#$number $pair: ${state:-unknown}"
            case "$state" in
              conflict) set_label "$number" merge-conflict; drop_label "$number" behind-base ;;
              behind) set_label "$number" behind-base; drop_label "$number" merge-conflict ;;
              fresh | missing) drop_label "$number" behind-base; drop_label "$number" merge-conflict ;;
              *) echo "::warning::#$number: couldn't check ($result)" ;;
            esac
          done <<< "$prs"
