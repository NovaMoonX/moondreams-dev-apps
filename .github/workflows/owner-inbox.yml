name: Owner inbox
# Rebuilds the pinned "📥 Owner inbox" issue from every open PR's 📋 Status
# comment: per session, what needs the owner, the PR stack, new screenshots.
# Plain Node with no install, so a run costs seconds and no model tokens.
on:
  issue_comment:
    types: [created, edited]
  pull_request:
    types:
      [
        opened,
        reopened,
        synchronize,
        closed,
        ready_for_review,
        converted_to_draft,
        labeled,
        unlabeled,
        edited,
      ]
  workflow_run:
    workflows: [Check Firestore indexes, PR version label, PR sync check]
    types: [completed]
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  checks: read
  issues: write
concurrency:
  group: owner-inbox
  # Not cancelling: a run for an ignored event (any other comment) would otherwise cancel a real rebuild before its job is skipped.
  cancel-in-progress: false
jobs:
  owner-inbox:
    # A fork's PR gets a read-only token, so only this repo's PRs rebuild on their own events.
    if: >-
      (github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '<!-- pr-status -->'))) &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ownerInbox
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild the inbox
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node scripts/ownerInbox/run.ts
