name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
# One deploy at a time, so two quick merges never work out the same version.
concurrency:
  group: deploy-main
  cancel-in-progress: false
permissions:
  contents: write
  checks: write
  pull-requests: write
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags --force
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          latest=${latest#v}
          latest=${latest:-1.112.0}
          labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].labels[].name' || true)
          IFS=. read -r major minor patch <<< "$latest"
          if grep -qx minor <<< "$labels"; then
            next="$major.$((minor + 1)).0"
          else
            next="$major.$minor.$((patch + 1))"
          fi
          echo "Version $latest -> $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - run: npm ci && npm run build
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN_CUSTOM: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN_CUSTOM }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ secrets.VITE_FIREBASE_APPCHECK_SITE_KEY }}
          VITE_GOOGLE_PLACES_API_KEY: ${{ secrets.VITE_GOOGLE_PLACES_API_KEY }}
          VITE_STORE_LOGO_TOKEN: ${{ secrets.VITE_STORE_LOGO_TOKEN }}
      # Tagged before the deploy so a failed deploy skips a number instead of reusing it; a re-run keeps its tag.
      - name: Tag the release
        run: |
          tag="v${{ steps.version.outputs.version }}"
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null || {
            git tag "$tag" "${{ github.sha }}"
            git push origin "$tag"
          }
      - name: Deploy Firebase resources
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-sa.json"
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          npm run fb:deploy:smart
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOONDREAMS_DEV_APPS }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOONDREAMS_DEV_APPS }}
          channelId: live
          projectId: moondreams-dev-apps
      - name: Publish app version
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp-sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-sa.json" npm run fb:version
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MOONDREAMS_DEV_APPS }}
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - name: Check for Cloudflare Worker changes
        id: worker_changes
        run: |
          if git diff --quiet ${{ github.event.before }} ${{ github.sha }} -- cloudflare-worker.js wrangler.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Cloudflare Worker
        if: steps.worker_changes.outputs.changed == 'true'
        continue-on-error: true
        run: npm run cf:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
