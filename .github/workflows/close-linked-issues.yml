name: Close linked issues
# GitHub honours "Resolves #N" only for a PR merged into the default branch, so a
# stacked PR (based on another PR's branch) never closes its issue on its own.
on:
  pull_request:
    types: [closed]
permissions:
  issues: write
jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const body = pr.body ?? '';
            const issueUrl = `https://github\\.com/${owner}/${repo}/issues/(\\d+)`;
            const pattern = new RegExp(
              `\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\\s+(?:#(\\d+)|${issueUrl})`,
              'gi',
            );
            const numbers = [...new Set([...body.matchAll(pattern)].map((match) => Number(match[1] ?? match[2])))];
            if (numbers.length === 0) {
              core.info('No linked issues.');
              return;
            }
            for (const issue_number of numbers) {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
              if (issue.pull_request || issue.state === 'closed') {
                core.info(`#${issue_number}: skipped (${issue.pull_request ? 'a PR' : 'already closed'}).`);
                continue;
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `Resolved by #${pr.number}, merged into \`${pr.base.ref}\`.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number, state: 'closed', state_reason: 'completed' });
              core.info(`#${issue_number}: closed.`);
            }
