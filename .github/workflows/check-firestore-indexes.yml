name: Check Firestore indexes
on:
  pull_request:
    paths:
      - 'src/**'
      - 'functions/src/**'
      - 'firestore.indexes.json'
      - 'firestore.rules'
      - 'scripts/checkRulesSize.ts'
      - 'scripts/checkFirestoreIndexes.ts'
      - 'scripts/fbInvoker.ts'
      - 'scripts/fbDeploySmart.ts'
      - '.firebaserc'
      - 'scripts/checks/**'
      - 'scripts/seeds/**'
      - 'docs/conventions/pipeline.md'
      - '.claude/settings.json'
jobs:
  check_indexes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:indexes
      - run: npm run check:rules-size
      - run: npm run check:pipeline-map
      # The deploy opens callables by reading this list; a line it can't read stops the deploy after the functions are out.
      - run: npm run fb:invoker -- --all --dry
  check_pinch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run check:pinch-math
      - run: npm run check:pinch-math
        env:
          TZ: America/Los_Angeles
      - run: npm run check:pinch-math
        env:
          TZ: Pacific/Auckland
      - run: npm run check:pinch-ingest
      - run: npm run check:pinch-voice
      - run: npm run check:pinch-share
  check_shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run check:option-match
      - run: npm run check:waypoint-pushes
      - run: npm run check:notification-expiry
      - run: npm run check:feedback-handoff
      - run: npm run check:a-list
      - run: npm run check:receipts
