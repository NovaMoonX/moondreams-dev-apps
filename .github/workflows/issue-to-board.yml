name: Issue to board
# Puts every open issue with an app label ("Runway (App)") on project board 3,
# filling Apps from the label and Status with Ready, each only while empty. A
# manual run sweeps every open issue. Plain Node with no install.
on:
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
concurrency:
  group: issue-to-board-${{ github.event.issue.number || 'all' }}
  cancel-in-progress: false
jobs:
  board:
    # A label that isn't an app label changes nothing on the board.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action != 'labeled' ||
      endsWith(github.event.label.name, ' (App)')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/board
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add to the board
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ github.event_name == 'workflow_dispatch' && '--all' || format('--issue {0}', github.event.issue.number) }}
        run: node scripts/board/run.ts $TARGET
