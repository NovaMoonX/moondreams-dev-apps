name: What's new note
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  whats-new:
    name: What's new note
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the What's new logic
        run: npm run check:whats-new-logic
      - name: Check every app marks itself entered
        run: npm run check:app-entered
      - name: Check the What's new notes
        run: npm run check:whats-new -- --pr "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
